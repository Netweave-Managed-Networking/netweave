networks:
  frontend:
  backend:
  proxy:
    name: netweave-proxy
    external: true

services:
  netweave-api:
    networks:
      backend:
      proxy:
        aliases:
          - ${INSTANCE_NAME:?INSTANCE_NAME must be set in .env}-api
    image: ghcr.io/netweave-managed-networking/netweave-api:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    container_name: netweave-api
    env_file:
      - .env
    depends_on:
      netweave-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  netweave-web:
    networks:
      frontend:
      backend:
      proxy:
        aliases:
          - ${INSTANCE_NAME:?INSTANCE_NAME must be set in .env}-web
    image: ghcr.io/netweave-managed-networking/netweave-web:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    container_name: netweave-web
    env_file:
      - .env
    depends_on:
      netweave-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  netweave-db:
    networks:
      - backend
    image: postgres:16-alpine
    container_name: netweave-db
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
