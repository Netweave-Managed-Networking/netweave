<div class="member-questions min-h-screen flex flex-col bg-base-200">
  <div
    class="member-questions__container w-full max-w-3xl mx-auto flex-1 flex flex-col gap-6 px-4 py-8"
  >
    <header class="member-questions__header flex flex-col gap-1">
      <h1 class="member-questions__title text-2xl font-bold">Fragebogen</h1>
      <p class="text-base-content/60">
        Erzähle uns von deiner Organisation, ihren Ressourcen und Bedarfen.
      </p>
    </header>

    <app-member-general-data
      [name]="memberForm.name"
      [contact]="memberForm.contact"
      [email]="invitation.value()?.email ?? ''"
    />

    <app-member-resources-requirements
      [fields]="memberForm.resourcesRequirements"
    />

    <app-member-culture [fields]="memberForm.cultureWeights" />
  </div>

  <div
    class="member-questions__actions sticky bottom-0 bg-base-100 border-t border-base-content/10"
  >
    <div
      class="w-full max-w-3xl mx-auto px-4 py-3 flex items-center justify-end gap-3"
    >
      @if (saveState() === 'success') {
        <span class="text-success text-sm">Gespeichert.</span>
      }
      @if (saveState() === 'error') {
        <span class="text-error text-sm">Speichern fehlgeschlagen.</span>
      }

      <button
        class="member-questions__submit btn btn-neutral"
        [disabled]="!canSave()"
        (click)="submit()"
      >
        Speichern
      </button>
    </div>
  </div>
</div>
