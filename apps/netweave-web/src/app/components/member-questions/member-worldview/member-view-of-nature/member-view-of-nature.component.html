<p [id]="questionId" class="member-view-of-nature__question leading-snug pb-3">
  Entscheide, welche Naturdarstellung am ehesten deinem Blick auf die Natur
  entspricht.
</p>

<div
  class="member-view-of-nature grid grid-cols-1 gap-3 sm:grid-cols-2"
  role="radiogroup"
  [attr.aria-labelledby]="questionId"
>
  @for (item of options; track item.option) {
    @let selected = value() === item.option;

    <label
      class="member-view-of-nature__option flex cursor-pointer flex-col gap-4 rounded-box border p-4 transition-colors duration-150 focus-within:border-base-content/30 hover:border-base-content/30 sm:p-5"
      [class]="
        selected
          ? 'member-view-of-nature__option--selected border-neutral bg-base-100 ring-1 ring-neutral'
          : 'border-base-content/10 bg-base-200/50'
      "
    >
      <input
        type="radio"
        class="sr-only"
        [name]="radioName"
        [value]="item.option"
        [checked]="selected"
        (change)="select(item.option)"
      />

      <span
        class="flex h-28 items-center justify-center rounded-field bg-base-100 p-3"
        aria-hidden="true"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="max-h-full max-w-full"
          [attr.viewBox]="item.image.viewBox"
        >
          <path
            [attr.d]="item.image.landscape"
            fill="none"
            stroke="#1E6291"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            [attr.cx]="item.image.ball.cx"
            [attr.cy]="item.image.ball.cy"
            r="12.5"
            fill="#F3B21E"
            stroke="#173A5E"
            stroke-width="2"
          />
        </svg>
      </span>

      <span class="flex items-start gap-3">
        <span
          class="mt-0.5 flex size-5 shrink-0 items-center justify-center rounded-full border transition-colors duration-150"
          [class]="
            selected ? 'border-neutral bg-neutral' : 'border-base-content/30'
          "
          aria-hidden="true"
        >
          @if (selected) {
            <span class="size-2 rounded-full bg-neutral-content"></span>
          }
        </span>
        <span
          class="member-view-of-nature__text leading-snug"
          [class.font-medium]="selected"
          >{{ item.text }}</span
        >
      </span>
    </label>
  }
</div>
