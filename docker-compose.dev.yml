name: netweave-dev
services:
  mailcatcher:
    image: axllent/mailpit
    container_name: netweave-mailcatcher
    ports:
      - '1025:1025' # SMTP - point SMTP_HOST/SMTP_PORT at this
      - '8025:8025' # Web UI - view caught mail at http://localhost:8025
    restart: unless-stopped

  db:
    image: postgres:16-alpine # same major version as the server
    container_name: netweave-db-dev
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
