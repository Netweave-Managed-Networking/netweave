name: Build & Deploy

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/netweave-managed-networking

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/netweave-api
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/netweave-api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/netweave-web
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/netweave-web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,proxy/docker-compose.yml,proxy/caddy/Caddyfile
          target: ~/netweave

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/netweave
            docker network inspect netweave-proxy >/dev/null 2>&1 || docker network create netweave-proxy
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "netweave-managed-networking" --password-stdin
            docker compose pull
            docker compose -f proxy/docker-compose.yml pull
            docker compose -f proxy/docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose up -d --remove-orphans
            docker compose -f proxy/docker-compose.yml up -d
            sleep 2 # give a freshly started Caddy a moment before reloading
            docker compose -f proxy/docker-compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f

      - name: Log in to GHCR # in order to verify images in the next step
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify images exist in GHCR
        run: |
          docker manifest inspect ${{ env.IMAGE_PREFIX }}/netweave-api:${{ github.ref_name }}
          docker manifest inspect ${{ env.IMAGE_PREFIX }}/netweave-web:${{ github.ref_name }}

      - name: Verify deployment on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/netweave
            UNHEALTHY="$(docker compose ps --status exited --status restarting -q)$(docker compose -f proxy/docker-compose.yml ps --status exited --status restarting -q)"
            if [ -n "$UNHEALTHY" ]; then
              echo "❌ One or more containers are not running"
              docker compose ps
              docker compose -f proxy/docker-compose.yml ps
              exit 1
            fi
            echo "✅ All containers are running"
